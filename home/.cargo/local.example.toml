# Copy this file to `.cargo/local.toml`.
# Only values that differ from .cargo/config.toml need to be listed here.
# This file is ignored by Git and may contain both secrets and device-specific
# configuration such as alternate GPIO assignments.

[env]
# XIAO ESP32-C3 defaults: IR D3/D4 (GPIO5/6), IR2 D6/D7 (GPIO21/20).
# Either appliance can use either port; the software ID selects its MQTT role.
# PIN_OPTICAL_TX = "5"
# PIN_OPTICAL_RX = "6"
# PIN_OPTICAL2_TX = "21"
# PIN_OPTICAL2_RX = "20"
# Original FreeMDU (inverted TX and RX) is the default. For a direct GPIO
# current-sink LED on either port, set that port's TX inversion to false.
# OPTICAL_TX_INVERTED = "false"
# OPTICAL_RX_INVERTED = "true"
# OPTICAL2_TX_INVERTED = "false"
# OPTICAL2_RX_INVERTED = "true"
# Accelerometer: set these to its actual, distinct SDA/SCL pins.
# PIN_ACCEL_SDA = "3"
# PIN_ACCEL_SCL = "4"
# ACCEL_SAMPLE_HZ = "50"
# ACCEL_PUBLISH_INTERVAL = "10"

WIFI_SSID = ""
WIFI_PASSWORD = ""
MQTT_HOSTNAME = ""
MQTT_USERNAME = ""
MQTT_PASSWORD = ""

OTA_TOKEN = ""

# Optional: read-only W307/ID410 RAM trace interval in seconds.
# ID410_TRACE_INTERVAL = "30"
