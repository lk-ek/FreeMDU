[build]
# Unset default target
target = ""

[env]
ESP_LOG = "info"

PIN_LED_STATUS = "10"
# XIAO ESP32-C3: IR on D3/D4, IR2 on D6/D7; MQTT role follows software ID.
PIN_OPTICAL_TX = "5"
PIN_OPTICAL_RX = "6"
PIN_OPTICAL2_TX = "21"
PIN_OPTICAL2_RX = "20"
# Original FreeMDU polarity on both ports; override TX=false for direct
# GPIO current-sink LED wiring (3V3 -> resistor -> LED -> GPIO).
OPTICAL_TX_INVERTED = "true"
OPTICAL_RX_INVERTED = "true"
OPTICAL2_TX_INVERTED = "true"
OPTICAL2_RX_INVERTED = "true"
# Accelerometer must not share optical GPIOs (adapt to your actual wiring).
ACCEL_ENABLED = "false"
PIN_ACCEL_SDA = "3"
PIN_ACCEL_SCL = "4"
ACCEL_SAMPLE_HZ = "50"
ACCEL_PUBLISH_INTERVAL = "10"

WIFI_SSID = ""
WIFI_PASSWORD = ""
MQTT_HOSTNAME = ""
MQTT_USERNAME = ""
MQTT_PASSWORD = ""

# Local OTA server. Override device-specific values via local.toml.
OTA_PORT = "3232"
OTA_TOKEN = "change-me"

# Authenticated live log console (uses OTA_TOKEN).
LOG_PORT = "3233"

# Authenticated read-only Miele diagnostic console (uses OTA_TOKEN).
DIAG_PORT = "3234"

# Authenticated raw optical bridge for remote TUI/protocol tools.
BRIDGE_PORT = "3235"

# Interval (in seconds) for publishing device properties and actions
DEVICE_PUBLISH_INTERVAL = "60"

# Optional ID410 RAM trace for explicit diagnostics. Disabled during normal
# operation because each sweep reads 1 KiB and can light the appliance PC LED.
ID410_TRACE_ENABLED = "false"
ID410_TRACE_INTERVAL = "30"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor --partition-table ./partitions.csv"
rustflags = [
  # Required to obtain backtraces
  "-C", "force-frame-pointers",
  "-C", "link-arg=-Tlinkall.x",
]
