[build]
# Unset default target
target = ""

[env]
ESP_LOG = "info"

PIN_LED_STATUS = "10"
PIN_OPTICAL_RX = "0"
PIN_OPTICAL_TX = "1"

WIFI_SSID = ""
WIFI_PASSWORD = ""
MQTT_HOSTNAME = ""
MQTT_USERNAME = ""
MQTT_PASSWORD = ""

# Local OTA server. Override device-specific values via local.toml.
OTA_PORT = "3232"
OTA_TOKEN = "change-me"

# Authenticated live log console (uses OTA_TOKEN).
LOG_PORT = "3233"

# Authenticated read-only Miele diagnostic console (uses OTA_TOKEN).
DIAG_PORT = "3234"

# Authenticated raw optical bridge for remote TUI/protocol tools.
BRIDGE_PORT = "3235"

# Interval (in seconds) for publishing device properties and actions
DEVICE_PUBLISH_INTERVAL = "60"

# Read-only RAM trace interval for experimental Miele software ID 410 support.
# A sweep reads 1 KiB in proven-reliable 16-byte chunks and logs only changes.
# Full snapshots are logged automatically when cycle state or program phase changes.
ID410_TRACE_INTERVAL = "30"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor --partition-table ./partitions.csv"
rustflags = [
  # Required to obtain backtraces
  "-C", "force-frame-pointers",
  "-C", "link-arg=-Tlinkall.x",
]
